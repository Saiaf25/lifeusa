<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>LifeUSA Article Plans and Outlines</title>
  <style>
    :root {
      --green: #116149;
      --gold: #c79236;
      --bg: #ffffff;
      --surface: #f6f7f5;
      --border: #d9ddd6;
      --text: #17231e;
      --text-muted: #617067;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .banner {
      background: var(--green);
      padding: 48px 0;
    }
    .banner-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .banner h1 {
      color: #fff;
      font-size: 38px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .banner p {
      color: rgba(255,255,255,0.78);
      font-size: 17px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 24px;
    }
    .page-list {
      display: grid;
      gap: 18px;
    }
    .page-card {
      display: block;
      padding: 24px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s, border-left-color 0.15s;
    }
    .page-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(23,35,30,0.08);
      border-left-color: var(--green);
    }
    .page-num {
      display: inline-block;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .page-title {
      color: var(--text);
      font-size: 20px;
      font-weight: 600;
    }
    .footer {
      background: var(--green);
      color: rgba(255,255,255,0.64);
      font-size: 14px;
      padding: 28px 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="banner-inner">
      <h1>LifeUSA Article Plans and Outlines</h1>
      <p>Planning pages and article-outline handoffs for Life for Relief and Development.</p>
    </div>
  </div>

  <div class="container">
    <div class="page-list">
      <a href="article-outline-template/" class="page-card">
        <div class="page-num">Page #001</div>
        <div class="page-title">LifeUSA Article Outline Template</div>
      </a>

      <a href="how-to-help-orphans/" class="page-card">
        <div class="page-num">Page #002</div>
        <div class="page-title">10 Ways To Help Orphans</div>
      </a>

      <a href="can-zakat-be-used-to-sponsor-an-orphan/" class="page-card">
        <div class="page-num">Page #003</div>
        <div class="page-title">Can Zakat Be Used To Sponsor an Orphan?</div>
      </a>
    </div>
  </div>

  <div class="footer">LifeUSA article planning</div>
</body>
</html>
